apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb-configmap
  namespace: homework3
  labels:
    app: mysql
    component: initdb
  
data:
  db.sql: |
    CREATE DATABASE IF NOT EXISTS hw2;
    USE hw2;
    -- Creazione della tabella "utenti" se non esiste
    CREATE TABLE IF NOT EXISTS utenti (
      email VARCHAR(255) PRIMARY KEY,
      ticker VARCHAR(255) NOT NULL,
      high_value DOUBLE DEFAULT NULL,
      low_value DOUBLE DEFAULT NULL 
    );
    -- Creazione della tabella "dati_finanziari" se non esiste
    CREATE TABLE IF NOT EXISTS dati_finanziari (
      email VARCHAR(255) NOT NULL,
      ticker VARCHAR(255) NOT NULL,
      valore DOUBLE NOT NULL,
      timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      FOREIGN KEY (email) REFERENCES utenti(email) ON DELETE CASCADE
    );
    CREATE USER IF NOT EXISTS 'pippo'@'%' IDENTIFIED BY 'ciao';
    GRANT ALL PRIVILEGES ON hw2.* TO 'pippo'@'%';
    FLUSH PRIVILEGES;

    INSERT INTO utenti (email, ticker,high_value,low_value) VALUES 
    ('costanzavincenzo99@gmail.com', 'AAPL',230,5),
    ('joseaquila20@gmail.com', 'AAPL',500,5);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: homework3
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: homework3
  labels:
    app: mysql
spec:
  ports:
    - port: 3306
  selector:
    app: mysql        
---    
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: homework3
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "ciao"
        - name: MYSQL_DATABASE
          value: "hw2"
        - name: MYSQL_USER
          value: "pippo"
        - name: MYSQL_PASSWORD
          value: "ciao"      
        volumeMounts:
         - name: mysql-data
           mountPath: /var/lib/mysql
         - name: mysql-initdb
           mountPath: /docker-entrypoint-initdb.d/db.sql
           subPath: db.sql
        ports:
         - containerPort: 3306     
      volumes:
         - name: mysql-data
           persistentVolumeClaim:
              claimName: mysql-pvc
         - name: mysql-initdb
           configMap:
             name: mysql-initdb-configmap