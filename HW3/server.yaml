apiVersion: v1
kind: Service
metadata:
  name: server-service
  namespace: homework3
  labels:
    app: server
spec:
  type: NodePort
  selector:
    app: server
  ports:
    - port: 50051
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: server-metrics
  namespace: homework3
  labels:
    app: server
spec:
  selector:
    app: server
  ports:
    - port: 8000
---    
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-deployment
  namespace: homework3
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: quay.io/vincenzo_cost/server_homework3:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
            - containerPort: 8000  