apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacollector-deployment
  namespace: homework3
  labels:
    app: datacollector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datacollector
  template:
    metadata:
      labels:
        app: datacollector
    spec:
      containers:
      - name: datacollector
        image: quay.io/vincenzo_cost/datacollector_homework3:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: datacollector-service
  namespace: homework3
  labels:
    app: datacollector
spec:
  selector:
    app: datacollector
  ports:
  - port: 8001