apiVersion: v1
kind: Service
metadata:
  name: alert-notifier-system
  namespace: homework3
  labels:
    app: alert-notifier-system
spec:
  selector:
    app: alert-notifier-system
  clusterIP: None  # Comunicazione interna basata su DNS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-notifier-system
  namespace: homework3
  labels:
    app: alert-notifier-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-notifier-system
  template:
    metadata:
      labels:
        app: alert-notifier-system
    spec:
      containers:
      - name: alert-notifier-system
        image: quay.io/vincenzo_cost/alertnotifiersystem_homework3:v1
        imagePullPolicy: Always